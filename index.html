    if(st==='Typed'||st==='Empty'){
      if(caret){caret._box.x=val?v._box.x+v._box.w+2:v._box.x;caret.style.left=caret._box.x+'px';caret.style.opacity=1;caret.classList.add('blink');}
    }
  }
  if(['Empty','Edit','Typed'].includes(st))addKeys(f);

}
function dockKeyboard(f,st){
  // several fields share a screen: whichever opens, its keyboard sits on the bottom edge (874 − 298)
  const kb=child(f,'keyboard');if(!kb)return;let y=0;for(let e=f;e&&e._box&&!e.classList.contains('scr');e=e.parentElement)y+=e._box.y;
  const top=(['Empty','Edit','Typed'].includes(st)?576:900)-y;kb._box.y=top;kb.style.top=top+'px';
}
// tap targets over the keyboard graphic (layout of the Figma iOS keyboard)
const KEYS=[];
'qwertyuiop'.split('').forEach((k,i)=>KEYS.push([k,9+i*39,16,33,44]));
'asdfghjkl'.split('').forEach((k,i)=>KEYS.push([k,28.5+i*39,68,33,44]));
KEYS.push(['shift',4,120,44,44]);'zxcvbnm'.split('').forEach((k,i)=>KEYS.push([k,67.5+i*39,120,33,44]));KEYS.push(['back',354,120,44,44]);
KEYS.push(['123',4,172,44,44],['emoji',54,172,44,44],['space',104,172,96,44],['@',206,172,44,44],['.com',256,172,44,44],['return',306,172,92,44]);
function addKeys(f){
  const kb=child(f,'keyboard');if(!kb||kb.querySelector('.key'))return;
  for(const [k,x,y,w,h] of KEYS){const d=document.createElement('div');d.className='key';d.dataset.k=k;
    d.style.cssText=`left:${x}px;top:${y}px;width:${w}px;height:${h}px`;kb.appendChild(d);}
}
APP.afterBuild=s=>{for(const e of s.querySelectorAll('.n'))if(e._inst&&FIELD_SETS.includes(SETOF[e._inst.cur]))bindField(e);};
APP.onChange=(ne,dest)=>{
  const set=SETOF[dest],st=COMP[dest]&&COMP[dest].vp&&COMP[dest].vp.State;
  if(set===COLLEGE_SET&&['HIT','Shenkar','Bezalel'].includes(st))ST.college=st;
  if(set===YEAR_SET&&YEARS.includes(st))ST.year=st;
  if(FIELD_SETS.includes(set)){ if(['Empty','Edit','Typed'].includes(st)){ST.focus=set;closeOthers(ne);} bindField(ne); }
};
function closeOthers(keep){
  for(const e of [...cur.querySelectorAll('.n')]){ if(e===keep||!e._inst||!e.isConnected||e.style.pointerEvents==='none')continue;
    const s=SETOF[e._inst.cur],st=stateOf(e);if(!TF[s]&&s!==AREA_SET)continue;if(!['Empty','Typed'].includes(st))continue;
    const v=s===AREA_SET?ST.about:ST[TF[s].key];changeTo(e,varId(s,v?'Done':'Start'),DONE); }
}
const TAP={t:'SMART_ANIMATE',du:.25,e:'EASE_OUT'},DONE={t:'SMART_ANIMATE',du:.6,e:'GENTLE'};
function typeKey(k){
  const f=liveField();if(!f)return false;
  const set=SETOF[f._inst.cur],st=stateOf(f);
  if(set===NAME_SET){
    const p=ST.active;
    if(k==='back'){ if(!ST[p]&&p==='last')ST.active='first'; else ST[p]=ST[p].slice(0,-1); }
    else if(k==='space'||k==='tab'){ if(p==='first'&&ST.first)ST.active='last'; }
    else if(k==='return'){ if(p==='first'&&ST.first)ST.active='last'; else if(ST.first){changeTo(f,varId(NAME_SET,'Done'),DONE);return true;} }
    else if(k==='shift'){ST.shift=!ST.shift;return true;}
    else if(k.length===1&&/[a-zA-Z֐-׿'-]/.test(k)){ let c=k; if(ST.shift||!ST[p])c=c.toUpperCase(); ST.shift=false; if(ST[p].length<18)ST[p]+=c; }
    else return true;
    if(st==='Empty'&&(ST.first||ST.last)){changeTo(f,varId(NAME_SET,'Edit'),TAP);return true;}
    bindField(f);return true;
  }
  if(set===AREA_SET){
    let t=ST.about;
    if(k==='back')t=t.slice(0,-1);
    else if(k==='return'){ if(t.trim().length>2)changeTo(f,varId(AREA_SET,'Done'),DONE); return true; }
    else if(k==='shift'){ST.shift=!ST.shift;return true;}
    else if(k==='123'||k==='emoji'||k==='tab')return true;
    else if(k==='space'){ if(t&&!t.endsWith(' '))t+=' '; }
    else if(k==='.com')t+='.com';
    else if(k.length===1&&/[\w\u0590-\u05FF.,!?'"’:;()&@#%+\/-]/.test(k)){ let c=k;
      if(ST.shift||!t.trim()||/[.!?]\s$/.test(t))c=c.toUpperCase(); ST.shift=false; t+=c; }
    else return true;
    ST.about=t.slice(0,240);
    if(st==='Empty'&&ST.about){changeTo(f,varId(AREA_SET,'Typed'),TAP);return true;}
    bindField(f);return true;
  }
  if(TF[set]){
    const C=TF[set],K=C.key;
    if(k==='back'){ST[K]=ST[K].slice(0,-1);if(C.pre&&ST[K]===C.pre)ST[K]='';}
    else if(k==='return'){ if(C.ok(ST[K]))changeTo(f,varId(set,'Done'),DONE); return true; }
    else if(k==='shift'){ST.shift=!ST.shift;return true;}
    else if(k==='space'||k==='tab'||k==='123'||k==='emoji')return true;
    else if(/^[\w@.+\/:-]+$/.test(k)){ let c=k;if(ST.shift&&c.length===1)c=c.toUpperCase();ST.shift=false;
      if(C.pre&&!ST[K]&&c!==C.pre)c=C.pre+c;
      if(ST[K].length<C.max)ST[K]+=c; }
    else return true;
    if(st==='Empty'&&ST[K]){changeTo(f,varId(set,'Typed'),TAP);return true;}
    bindField(f);return true;
  }
  return false;
}
APP.click=el=>{
  if(el.classList&&el.classList.contains('key')){typeKey(el.dataset.k);return true;}
  if(!el._n)return false;
  const f=fieldOf(el);if(!f)return false;
  const set=SETOF[f._inst.cur],st=stateOf(f),nm=el._n.n;
  if(set===NAME_SET&&(st==='Empty'||st==='Edit')){
    if(/first$/.test(nm)){ST.active='first';bindField(f);return true;}
    if(/last$/.test(nm)){ST.active='last';bindField(f);return true;}
    if(nm==='pill-btn'||nm==='icon-check'){ if(ST.first)changeTo(f,varId(NAME_SET,'Done'),DONE); return true; }
    return true;
  }
  if(set===AREA_SET&&(st==='Empty'||st==='Typed')){
    ST.focus=set;
    if(nm==='btn'||nm==='icon-check'){ if(ST.about.trim().length>2)changeTo(f,varId(AREA_SET,'Done'),DONE); }
    return true;
  }
  if(TF[set]&&(st==='Empty'||st==='Typed')){
    ST.focus=set;
    if(nm==='pill-btn'||nm==='icon-check'){ if(TF[set].ok(ST[TF[set].key]))changeTo(f,varId(set,'Done'),DONE); }
    return true;
  }
  if(set===NAME_SET&&(st==='Done'||st==='Start'))ST.active='first';
  return false;
};
document.addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const map={Backspace:'back',Enter:'return',Tab:'tab',' ':'space'};
  const k=map[e.key]||(e.key.length===1?e.key:null);if(!k)return;
  if(!liveField())return;
  if(typeKey(k)){e.preventDefault();
    const lf=liveField(),kb=lf&&child(lf,'keyboard'),d=kb&&kb.querySelector(`.key[data-k="${CSS.escape(k.toLowerCase())}"]`);
    if(d){d.classList.add('down');setTimeout(()=>d.classList.remove('down'),120);} }
});
</script>

<script>
/* ======================================================================
   Part 3 — New project flow: pitching → describe → missing skills →
   what you bring → budget (keypad, − / +) → due date (calendar) →
   scanning → mission crew → departments → Amit's profile.
   ====================================================================== */
const MAX_SKILLS=4;
const FR_BUDGET0='861:15321',FR_BUDGET='861:15423',FR_DUE='861:15480',FR_BRING='790:38964';
const isChipSet=set=>{const vs=Object.keys(COMP).filter(k=>SETOF[k]===set).map(k=>COMP[k].vp&&COMP[k].vp.State);
  return vs.length===2&&vs.includes('On')&&vs.includes('Off');};
const isOn=e=>{const c=COMP[e._inst.cur];return !!(c&&c.vp&&c.vp.State==='On'&&isChipSet(SETOF[e._inst.cur]));};

/* ---------- skills: four at most ---------- */
APP.allowChange=(inst,dest)=>{
  const v=COMP[dest];if(!v||!v.vp||v.vp.State!=='On'||!isChipSet(SETOF[dest]))return true;
  const on=[...cur.querySelectorAll('.n')].filter(e=>e!==inst&&e._inst&&e.isConnected&&e.style.pointerEvents!=='none'&&isOn(e)).length;
  if(on<MAX_SKILLS)return true;
  // full: the tile shakes, and the four chosen ones pulse once
  if(!RM){inst.animate([{transform:'none'},{transform:'translateX(-6px)'},{transform:'translateX(5px)'},{transform:'translateX(-3px)'},{transform:'none'}],{duration:320,easing:'ease-out'});
    for(const e of cur.querySelectorAll('.n'))if(e._inst&&e!==inst&&e.style.pointerEvents!=='none'&&isOn(e))e.animate([{transform:'none'},{transform:'scale(.95)'},{transform:'none'}],{duration:320,easing:'ease-out'});}
  return false;
};

/* ---------- describe your project: multi-line text box ---------- */
function bindArea(f,st){
  const v=child(f,'val'),hint=child(f,'hint'),caret=child(f,'caret');if(!v)return;
  const inner=v.firstChild,sp=v.querySelector('span');
  if(ST.about||st==='Typed'||st==='Done'){
    if(sp){sp.textContent=ST.about;[...v.querySelectorAll('span')].slice(1).forEach(x=>{if(!x.classList.contains('tcar'))x.textContent='';});}
    v.style.opacity=ST.about?1:0; if(hint&&ST.about)hint.style.opacity=0;
  }
  let car=v.querySelector('.tcar');
  const typing=st==='Empty'||st==='Typed';
  if(typing&&ST.about){
    if(!car){car=document.createElement('span');car.className='tcar blink';car.textContent='';inner.appendChild(car);}
    car.style.cssText=`display:inline-block;width:2px;height:1.1em;vertical-align:-.15em;margin-left:1px;background:${accent()}`;
    if(caret)caret.style.opacity=0;
  } else if(car)car.remove();
  if(typing&&!ST.about&&caret){caret.style.opacity=1;caret.classList.add('blink');}
  // keep the last line in view once the box is full
  v.style.overflow='hidden';inner.style.marginTop='0px';
  requestAnimationFrame(()=>{const over=inner.scrollHeight-v.clientHeight;inner.style.marginTop=typing&&over>0?(-over)+'px':'0px';});
  if(typing)addKeys(f);
}

/* ---------- helpers ---------- */
const kidsN=(s,nm)=>[...s.children].filter(c=>c._n&&c._n.n===nm);
function place(el,x,w){ if(!el)return; if(x!=null){el._box.x=x;el.style.left=x+'px';} if(w!=null){el._box.w=w;el.style.width=w+'px';} }
function setLabel(el,t,col){ const sp=el.querySelector('span');sp.textContent=t;[...el.querySelectorAll('span')].slice(1).forEach(x=>x.textContent='');
  if(col)sp.style.color=col; const w=Math.ceil(textW(t,parseFloat(sp.style.fontSize),sp.style.fontWeight||700))+1;
  el.classList.add('nw');place(el,null,w);return w; }
const fmtNum=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',');
function sheet(s,h,cls){ // a panel that slides up from the bottom of the screen, like the keyboard
  const d=document.createElement('div');d.className='sheet '+cls;d.style.cssText=`position:absolute;left:0;top:${874-h}px;width:402px;height:${h}px;z-index:20`;
  s.appendChild(d);if(!RM)d.animate([{transform:`translateY(${h}px)`},{transform:'none'}],{duration:420,easing:springEase(1,170,24,.42)});return d;}
function closeSheet(s,cls){ const d=s&&s.querySelector('.sheet.'+cls);if(!d)return;
  if(RM){d.remove();return;} d.animate([{transform:'none'},{transform:`translateY(${d.offsetHeight}px)`}],{duration:280,easing:'cubic-bezier(.4,0,1,1)',fill:'forwards'}).onfinish=()=>d.remove(); }

/* ---------- what is your budget ---------- */
function budgetLayout(s){
  const areas=kidsN(s,'area').sort((a,b)=>a._box.x-b._box.x);if(areas.length<3)return;
  const [mi,mid,pl]=areas,lab=kidsN(s,'placeholder')[0],plus=kidsN(s,'akar-icons:plus')[0],minus=kidsN(s,'akar-icons:minus')[0];
  const has=ST.budget!=='';const t=(has?fmtNum(ST.budget):'0')+' nis';
  const tw=setLabel(lab,t,has?'#242424':null);
  const w=Math.max(104,Math.ceil(tw)+32);place(mid,null,w);place(lab,mid._box.x+(w-tw)/2);
  place(pl,mid._box.x+w+13);place(plus,pl._box.x+17);
  let car=lab.querySelector('.tcar');
  if(s.querySelector('.sheet.pad')){ if(!car){car=document.createElement('span');car.className='tcar blink';lab.firstChild.appendChild(car);}
    car.style.cssText=`display:inline-block;width:2px;height:1.1em;vertical-align:-.15em;margin-left:2px;background:${accent()}`; place(lab,null,tw+4); }
  else if(car)car.remove();
  const step=d=>{ const n=Math.max(0,(+ST.budget||0)+d);ST.budget=String(n);budgetLayout(s);padDisplay(s);
    lab.animate([{transform:`translateY(${d>0?-6:6}px)`,opacity:.3},{transform:'none',opacity:1}],{duration:220,easing:'ease-out'}); };
  for(const e of [mi,minus])e._act=()=>step(-50);
  for(const e of [pl,plus])e._act=()=>step(50);
  for(const e of [mid,lab])e._act=()=>{openPad(s);};
  for(const e of [mi,minus,pl,plus,mid,lab])e.classList.add('hot');
}
// iOS number pad (as in the reference): light sheet with round top corners, the number on top,
// white keys with letters, an empty key bottom-left and delete bottom-right
const PADK=[['1',''],['2','ABC'],['3','DEF'],['4','GHI'],['5','JKL'],['6','MNO'],['7','PQRS'],['8','TUV'],['9','WXYZ'],['',''],['0',''],['back','']];
function openPad(s){
  if(s.querySelector('.sheet.pad'))return;
  const d=sheet(s,339,'pad');
  d.style.background='#f4f4f7';d.style.borderRadius='30px 30px 0 0';d.style.boxShadow='0 -0.5px 0 rgba(0,0,0,.12),0 -8px 30px rgba(0,0,0,.06)';
  const disp=document.createElement('div');disp.className='pdisp';
  disp.style.cssText='position:absolute;left:0;right:0;top:12px;height:22px;text-align:center;font:400 17px/22px "Helvetica Neue",Helvetica,Arial,sans-serif;color:#000;letter-spacing:.01em';
  d.appendChild(disp);
  PADK.forEach(([k,sub],i)=>{ if(!k)return;
    const b=document.createElement('div');b.className='npk';b.dataset.k=k;
    const x=3+(i%3)*133.5,y=48+Math.floor(i/3)*54;
    b.style.cssText=`position:absolute;left:${x}px;top:${y}px;width:129px;height:46px;border-radius:7px;background:#fff;cursor:pointer;
      display:flex;flex-direction:column;align-items:center;justify-content:center;color:#000;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif`;
    if(k==='back')b.innerHTML='<svg width="23" height="17" viewBox="0 0 23 17" fill="none" stroke="#000" stroke-width="1.6" stroke-linejoin="round"><path d="M7 1h13.5a1.5 1.5 0 0 1 1.5 1.5v12a1.5 1.5 0 0 1-1.5 1.5H7L1 8.5z"/><path d="M11 5l7 7M18 5l-7 7" stroke-linecap="round"/></svg>';
    else b.innerHTML=`<span style="font-size:24px;line-height:24px;font-weight:400">${k}</span>${sub?`<span style="font-size:9px;line-height:10px;font-weight:600;letter-spacing:.16em;margin-left:.16em">${sub}</span>`:''}`;
    d.appendChild(b);});
  budgetLayout(s);padDisplay(s);
}
function padDisplay(s){const d=s.querySelector('.sheet.pad .pdisp');if(d)d.textContent=ST.budget?fmtNum(ST.budget):'';}
function padKey(k){
  const s=cur;if(!s||!s.querySelector('.sheet.pad'))return false;
  if(k==='back')ST.budget=ST.budget.slice(0,-1);
  else if(k==='done'||k==='return'){ closeSheet(s,'pad');ST.padOpen=false;setTimeout(()=>budgetLayout(s),300);return true; }
  else if(/^\d$/.test(k)){ if(ST.budget==='0')ST.budget=''; if(ST.budget.length<7)ST.budget+=k; }
  else return true;
  budgetLayout(s);padDisplay(s);return true;
}
// a tap anywhere outside the pad puts it away, like iOS
phone.addEventListener('pointerdown',e=>{
  const s=cur;if(!s||!s.querySelector('.sheet.pad'))return;
  if(e.target.closest&&e.target.closest('.sheet.pad'))return;
  const n=e.target.closest&&e.target.closest('.n');const nm=n&&n._n&&n._n.n;
  if(n&&(n._act||(n.parentElement&&n.parentElement._act)))return; // the number itself, − and + keep it open
  padKey('done');
},true);

/* ---------- when is your project due ---------- */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const MON3=MONTHS.map(m=>m.slice(0,3));
function dueLayout(s){
  const area=kidsN(s,'area')[0],lab=kidsN(s,'placeholder')[0],pen=kidsN(s,'icon-pen')[0];if(!area||!lab)return;
  if(ST.due){const d=ST.due;const t=`Due ${d.getDate()} ${MON3[d.getMonth()]} ${d.getFullYear()}`;
    const tw=setLabel(lab,t,'#242424');place(area,null,Math.ceil(tw)+13+16+18+17);if(pen)place(pen,area._box.x+area._box.w-35);}
  for(const e of [area,lab,pen])if(e){e._act=()=>openCal(s);e.classList.add('hot');}
}
function openCal(s){
  if(s.querySelector('.sheet.cal'))return;
  const today=new Date();today.setHours(0,0,0,0);
  let view=ST.due?new Date(ST.due.getFullYear(),ST.due.getMonth(),1):new Date(today.getFullYear(),today.getMonth(),1);
  const d=sheet(s,452,'cal');d.style.cssText+=';background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.12)';
  const A=accent(),onA=lum(A)>.55?'#242424':'#ffffff';
  const draw=()=>{
    d.innerHTML='';
    const head=document.createElement('div');
    head.style.cssText='position:absolute;left:26px;right:26px;top:24px;height:34px;display:flex;align-items:center;justify-content:space-between;font:700 24px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;color:#242424';
    const title=document.createElement('div');title.textContent=`${MONTHS[view.getMonth()]} ${view.getFullYear()}`;
    const nav=document.createElement('div');nav.style.cssText='display:flex;gap:8px';
    for(const [k,ch] of [['prev','‹'],['next','›']]){const b=document.createElement('div');b.className='calk';b.dataset.k=k;b.textContent=ch;
      b.style.cssText=`width:42px;height:34px;border-radius:4px;background:${tintOf(A)};color:${ink(A)};display:flex;align-items:center;justify-content:center;cursor:pointer;font:700 24px/1 "Helvetica Neue",Helvetica,Arial,sans-serif`;
      nav.appendChild(b);}
    head.append(title,nav);d.appendChild(head);
    const grid=document.createElement('div');grid.style.cssText='position:absolute;left:13px;top:76px;width:376px;display:grid;grid-template-columns:repeat(7,1fr);gap:4px';
    for(const w of ['S','M','T','W','T','F','S']){const c=document.createElement('div');c.textContent=w;c.style.cssText='height:24px;text-align:center;font:700 12px/24px "Helvetica Neue",Helvetica,Arial,sans-serif;color:#aeaeb2';grid.appendChild(c);}
    const first=view.getDay(),days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();
    for(let i=0;i<first;i++)grid.appendChild(document.createElement('div'));
    for(let n=1;n<=days;n++){
      const day=new Date(view.getFullYear(),view.getMonth(),n),past=day<today,sel=ST.due&&+day===+ST.due,isT=+day===+today;
      const c=document.createElement('div');c.textContent=n;if(!past){c.className='calk';c.dataset.k='d'+n;}
      c.style.cssText=`height:50px;border-radius:4px;display:flex;align-items:center;justify-content:center;font:700 17px/1 "Helvetica Neue",Helvetica,Arial,sans-serif;
        cursor:${past?'default':'pointer'};color:${sel?onA:past?'#d1d1d6':'#242424'};background:${sel?A:past?'transparent':tintOf(A)};${isT&&!sel?`box-shadow:inset 0 0 0 2px ${A};`:''}`;
      grid.appendChild(c);}
    d.appendChild(grid);
  };
  d._key=k=>{
    if(k==='prev'){const p=new Date(view.getFullYear(),view.getMonth()-1,1);if(p>=new Date(today.getFullYear(),today.getMonth(),1)){view=p;draw();}return;}
    if(k==='next'){view=new Date(view.getFullYear(),view.getMonth()+1,1);draw();return;}
    if(k[0]==='d'){ST.due=new Date(view.getFullYear(),view.getMonth(),+k.slice(1));draw();
      setTimeout(()=>{closeSheet(s,'cal');dueLayout(s);
        const lab=kidsN(s,'placeholder')[0];if(lab&&!RM)lab.animate([{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'none'}],{duration:300,easing:'ease-out'});},260);}
  };
  draw();
}

/* ---------- scanning 1,240 students ----------
   The crowd reshuffles on the 13px grid of the Figma frames (tiles and gaps are
   multiples of 13), always inside the screen, every face centred in its tile,
   and your home button stays put. The last shuffle hands its tiles to the
   "Mission crew" screen, so they glide straight into the results. */
const SCAN_PAL=['#ffa1ca','#8d655d','#dcedbd','#ad7f13','#c27944','#dc8855','#749191','#7c667c','#b2a4ff','#f6ba2f','#56729d','#ffda7c',
  '#d3d892','#fed5cc','#d39a79','#c6daa2','#9bc9ee','#ff634b','#6f9077','#ec9bbc','#1e2c59','#96315a','#ffc0b3','#1f7854','#c6e7ff','#ffe6ab','#c92327','#7293ff'];
const SCAN_OWN={a:13,b:19,c:38,d:44};               // 169,494 · 65×65 — where the home button sits on "Mission crew"
const rng=seed=>()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
function partition(seed,K){
  const R=rng(seed),O=SCAN_OWN;let regs=[{a:1,b:31,c:27,d:67}];  // grid units of 13px: x 13…390, y 351…858
  const W=r=>r.b-r.a,H=r=>r.d-r.c,isOwn=r=>r.a===O.a&&r.b===O.b&&r.c===O.c&&r.d===O.d;
  const cut=(r,v,at)=>v?[{...r,b:at},{...r,a:at}]:[{...r,d:at},{...r,c:at}];
  // carve the home-button cell out first, along its own edges, in a random order
  for(let guard=0;guard<8;guard++){const i=regs.findIndex(r=>r.a<=O.a&&r.b>=O.b&&r.c<=O.c&&r.d>=O.d);const r=regs[i];if(isOwn(r))break;
    const opts=[];if(r.a<O.a)opts.push([1,O.a]);if(r.b>O.b)opts.push([1,O.b]);if(r.c<O.c)opts.push([0,O.c]);if(r.d>O.d)opts.push([0,O.d]);
    const [v,at]=opts[Math.floor(R()*opts.length)];regs.splice(i,1,...cut(r,v,at));}
  const MIN=6;
  for(let guard=0;guard<60&&regs.filter(r=>!isOwn(r)).length<K;guard++){
    const cand=regs.filter(r=>!isOwn(r)&&(W(r)>=2*MIN||H(r)>=2*MIN)).sort((x,y)=>W(y)*H(y)-W(x)*H(x));if(!cand.length)break;
    const r=cand[Math.min(cand.length-1,Math.floor(R()*1.6))];
    let v=W(r)>H(r)*1.25?1:H(r)>W(r)*1.25?0:(R()<.5?1:0);if(v&&W(r)<2*MIN)v=0;if(!v&&H(r)<2*MIN)v=1;
    const lo=(v?r.a:r.c)+MIN,hi=(v?r.b:r.d)-MIN,at=lo+Math.floor(R()*(hi-lo+1));
    regs.splice(regs.indexOf(r),1,...cut(r,v,at));}
  return regs.filter(r=>!isOwn(r)).map(r=>{
    const t={x:13*r.a,Y:13*r.c,w:13*W(r)-13,h:13*H(r)-13,cr:[4,4,4,4]};
    if(r.b===31)t.w-=1; if(r.d===67){t.h+=3;if(r.a===1)t.cr[3]=50;if(r.b===31)t.cr[2]=50;}
    return t;});
}
function scanChars(){ const f=N['709:27721'];return f.k.filter(c=>isChar(c)&&!OWN_AV.has(c.g)).map(c=>c.g); }
function scanFrames(){
  const res=N['709:26102'],RES=res.k.filter(c=>c.y==='RE'&&/^Rectangle/.test(c.n));
  const chars=scanChars();const seed0=(Date.now()%9973)+7;const steps=[];
  const norm=t=>({x:(t.x+t.w/2-13)/377,y:(t.Y+t.h/2-208)/653});   // results-tile centre, mapped into the scan area
  const names=[...RES.map(r=>r.n),'scan-8','scan-9','scan-10'];
  for(let k=0;k<4;k++){
    const last=k===3,tiles=partition(seed0+k*131,last?RES.length:11);
    // give each tile a stable name: the results tile nearest to it (so the last shuffle lands on "Mission crew")
    const free=[...(last?RES.map(r=>r.n):names)],cen=t=>({x:(t.x+t.w/2-13)/377,y:(t.Y+t.h/2-351)/510});
    const pairs=[];for(const t of tiles)for(const nm of free){const r=RES.find(q=>q.n===nm);const a=cen(t),b=r?norm(r):{x:.5,y:.5};pairs.push([Math.hypot(a.x-b.x,a.y-b.y),t,nm]);}
    pairs.sort((x,y)=>x[0]-y[0]);const used=new Set(),got=new Set();
    for(const [,t,nm] of pairs){if(used.has(t)||got.has(nm))continue;used.add(t);got.add(nm);t.n=nm;}
    steps.push(tiles);
  }
  const ids=[];
  for(let k=0;k<steps.length;k++){
    const f=clone(N['709:27226']);
    const keep=f.k.filter(c=>c.n==='Status bar'||(c.y==='TE'&&/^Scanning/.test(c.ch||'')));
    const gen=[],top=[];
    steps[k].forEach((t,i)=>{
      const ni=names.indexOf(t.n),col=SCAN_PAL[(ni*7+k*5)%SCAN_PAL.length];
      gen.push({n:t.n,y:'RE',fixc:1,x:t.x,Y:t.Y,w:t.w,h:t.h,cr:t.cr,f:[{t:'S',c:col,o:1}]});
      const g=chars[(ni+k*3)%chars.length],[cw,ch]=svgSize(g),sc=Math.min(.62*t.w/cw,.7*t.h/ch);
      const w=cw*sc,h=ch*sc;top.push({n:'face-'+t.n,y:'GR',g,fit:1,x:t.x+(t.w-w)/2,Y:t.Y+(t.h-h)/2,w,h});
    });
    gen.push({n:'home-btn',y:'GR',g:'a0o6sp30d',x:169,Y:494,w:65,h:65});
    const si=keep.findIndex(c=>c.n==='Status bar');
    f.k=[...keep.slice(0,si),...gen,...top,...keep.slice(si)];
    f.r=[];ids.push(addFrame('709:27226',f));
  }
  ids.forEach((id,k)=>{N[id].r=[{t:'AFTER_TIMEOUT',d:k===0?.5:.4,a:[{n:'NAVIGATE',d:ids[k+1]||'709:26102',tr:{t:'SMART_ANIMATE',du:k===ids.length-1?.9:.77,e:'GENTLE'}}]}];});
  return ids[0];
}

  N[FR_BRING].r=[SW(FR_BUDGET0),{t:'ON_DRAG',a:[{n:'NAVIGATE',d:'790:38782',tr:{...PUSHB}}]}];
  // budget: opens when you tap it (no auto-advance)
  const b0=N[FR_BUDGET0];b0.r=[{t:'ON_DRAG',a:[{n:'NAVIGATE',d:FR_BRING,tr:{...PUSHB}}]}];
  for(const c of b0.k)if(['area','placeholder','akar-icons:plus'].includes(c.n))c.r=[{t:'ON_CLICK',a:[{n:'APP',f:'budgetOpen'}]}];
  N[FR_BUDGET].r=[SW(FR_DUE),{t:'ON_DRAG',a:[{n:'NAVIGATE',d:FR_BRING,tr:{...PUSHB}}]}];
  N[FR_DUE].r=[SW('709:27226'),{t:'ON_DRAG',a:[{n:'NAVIGATE',d:FR_BUDGET,tr:{...PUSHB}}]}];
  // swipe back works through the whole pitch too
  const navs=o=>{const out=[];(function w(o){for(const r of o.r||[])if(r.t==='ON_DRAG'||r.t==='AFTER_TIMEOUT')for(const a of r.a)if(a.n==='NAVIGATE')out.push(a.d);(o.k||[]).forEach(w);})(o);return out;};

}

const _click=APP.click;
APP.click=el=>{
