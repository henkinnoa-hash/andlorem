  const areas=kidsN(s,'area').sort((a,b)=>a._box.x-b._box.x);if(areas.length<3)return;
  const [mi,mid,pl]=areas,lab=kidsN(s,'placeholder')[0],plus=kidsN(s,'akar-icons:plus')[0],minus=kidsN(s,'akar-icons:minus')[0];
  const has=ST.budget!=='';const t=(has?fmtNum(ST.budget):'0')+' nis';
  const tw=setLabel(lab,t,has?'#242424':null);
  const w=Math.max(104,Math.ceil(tw)+32);place(mid,null,w);place(lab,mid._box.x+(w-tw)/2);
  place(pl,mid._box.x+w+13);place(plus,pl._box.x+17);
  let car=lab.querySelector('.tcar');
  if(padOn(s)){ if(!car){car=document.createElement('span');car.className='tcar blink';lab.firstChild.appendChild(car);}
    car.style.cssText=`display:inline-block;width:2px;height:1.1em;vertical-align:-.15em;margin-left:2px;background:${accent()}`; place(lab,null,tw+4); }
  else if(car)car.remove();
  const step=d=>{ const n=Math.max(0,(+ST.budget||0)+d);ST.budget=String(n);budgetLayout(s);padDisplay(s);
    lab.animate([{transform:`translateY(${d>0?-6:6}px)`,opacity:.3},{transform:'none',opacity:1}],{duration:220,easing:'ease-out'}); };
  for(const e of [mi,minus])e._act=()=>step(-50);
  for(const e of [pl,plus])e._act=()=>step(50);

  for(const e of [mi,minus,pl,plus,mid,lab])e.classList.add('hot');
}

/* ---------- scanning 1,240 students ----------
   The crowd reshuffles on the 13px grid of the Figma frames (tiles and gaps are
   multiples of 13), always inside the screen, every face centred in its tile,
   and your home button stays put. The last shuffle hands its tiles to the
   "Mission crew" screen, so they glide straight into the results. */
const SCAN_PAL=['#ffa1ca','#8d655d','#dcedbd','#ad7f13','#c27944','#dc8855','#749191','#7c667c','#b2a4ff','#f6ba2f','#56729d','#ffda7c',
  '#d3d892','#fed5cc','#d39a79','#c6daa2','#9bc9ee','#ff634b','#6f9077','#ec9bbc','#1e2c59','#96315a','#ffc0b3','#1f7854','#c6e7ff','#ffe6ab','#c92327','#7293ff'];
const SCAN_OWN={a:13,b:19,c:38,d:44};               // 169,494 · 65×65 — where the home button sits on "Mission crew"
const rng=seed=>()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
function partition(seed,K){
  const R=rng(seed),O=SCAN_OWN;let regs=[{a:1,b:31,c:27,d:67}];  // grid units of 13px: x 13…390, y 351…858
  const W=r=>r.b-r.a,H=r=>r.d-r.c,isOwn=r=>r.a===O.a&&r.b===O.b&&r.c===O.c&&r.d===O.d;
  const cut=(r,v,at)=>v?[{...r,b:at},{...r,a:at}]:[{...r,d:at},{...r,c:at}];
  // carve the home-button cell out first, along its own edges, in a random order
  for(let guard=0;guard<8;guard++){const i=regs.findIndex(r=>r.a<=O.a&&r.b>=O.b&&r.c<=O.c&&r.d>=O.d);const r=regs[i];if(isOwn(r))break;
    const opts=[];if(r.a<O.a)opts.push([1,O.a]);if(r.b>O.b)opts.push([1,O.b]);if(r.c<O.c)opts.push([0,O.c]);if(r.d>O.d)opts.push([0,O.d]);
    const [v,at]=opts[Math.floor(R()*opts.length)];regs.splice(i,1,...cut(r,v,at));}
  const MIN=6;
  for(let guard=0;guard<60&&regs.filter(r=>!isOwn(r)).length<K;guard++){
    const cand=regs.filter(r=>!isOwn(r)&&(W(r)>=2*MIN||H(r)>=2*MIN)).sort((x,y)=>W(y)*H(y)-W(x)*H(x));if(!cand.length)break;
    const r=cand[Math.floor(Math.pow(R(),.7)*cand.length)];
    let v=W(r)>H(r)*1.25?1:H(r)>W(r)*1.25?0:(R()<.5?1:0);if(v&&W(r)<2*MIN)v=0;if(!v&&H(r)<2*MIN)v=1;
    // cuts near an edge more often than in the middle: one big tile beside a slim one
    const lo=(v?r.a:r.c)+MIN,hi=(v?r.b:r.d)-MIN,u=R(),sk=u<.5?Math.pow(u*2,2.2)/2:1-Math.pow((1-u)*2,2.2)/2,at=lo+Math.round(sk*(hi-lo));
    regs.splice(regs.indexOf(r),1,...cut(r,v,at));}
  return regs.filter(r=>!isOwn(r)).map(r=>{
    const t={x:13*r.a,Y:13*r.c,w:13*W(r)-13,h:13*H(r)-13,cr:[4,4,4,4]};
    if(r.b===31)t.w-=1; if(r.d===67){t.h+=3;if(r.a===1)t.cr[3]=50;if(r.b===31)t.cr[2]=50;}
    return t;});
}
function scanChars(){ const f=N['709:27721'];return f.k.filter(c=>isChar(c)&&!OWN_AV.has(c.g)).map(c=>c.g); }
function scanFrames(){
  const res=N['709:26102'],RES=res.k.filter(c=>c.y==='RE'&&/^Rectangle/.test(c.n));
  const chars=scanChars();const seed0=(Date.now()%9973)+7;const steps=[];
  const norm=t=>({x:(t.x+t.w/2-13)/377,y:(t.Y+t.h/2-208)/653});   // results-tile centre, mapped into the scan area
  const names=[...RES.map(r=>r.n),'scan-8','scan-9','scan-10'];
  for(let k=0;k<4;k++){
    const last=k===3,tiles=partition(seed0+k*131,last?RES.length:[9,6,11][k]);
    // give each tile a stable name: the results tile nearest to it (so the last shuffle lands on "Mission crew")
    const free=[...(last?RES.map(r=>r.n):names)],cen=t=>({x:(t.x+t.w/2-13)/377,y:(t.Y+t.h/2-351)/510});
    const pairs=[];for(const t of tiles)for(const nm of free){const r=RES.find(q=>q.n===nm);const a=cen(t),b=r?norm(r):{x:.5,y:.5};pairs.push([Math.hypot(a.x-b.x,a.y-b.y),t,nm]);}
    pairs.sort((x,y)=>x[0]-y[0]);const used=new Set(),got=new Set();
    for(const [,t,nm] of pairs){if(used.has(t)||got.has(nm))continue;used.add(t);got.add(nm);t.n=nm;}
    steps.push(tiles);
  }
  const ids=[];
  for(let k=0;k<steps.length;k++){
    const f=clone(N['709:27226']);
    const keep=f.k.filter(c=>c.n==='Status bar'||(c.y==='TE'&&/^Scanning/.test(c.ch||'')));
    const gen=[],top=[];
    steps[k].forEach((t,i)=>{
      const ni=names.indexOf(t.n),col=SCAN_PAL[(ni*5+k*11)%SCAN_PAL.length];
      gen.push({n:t.n,y:'RE',fixc:1,x:t.x,Y:t.Y,w:t.w,h:t.h,cr:t.cr,f:[{t:'S',c:col,o:1}]});
      const g=chars[(ni+k*3)%chars.length],[cw,ch]=svgSize(g),sc=Math.min(.62*t.w/cw,.7*t.h/ch);
      const w=cw*sc,h=ch*sc;top.push({n:'face-'+t.n,y:'GR',g,fit:1,x:t.x+(t.w-w)/2,Y:t.Y+(t.h-h)/2,w,h});
    });
    gen.push({n:'home-btn',y:'GR',g:'a0o6sp30d',x:169,Y:494,w:65,h:65});
    const si=keep.findIndex(c=>c.n==='Status bar');
    f.k=[...keep.slice(0,si),...gen,...top,...keep.slice(si)];
    f.r=[];ids.push(addFrame('709:27226',f));
  }
  ids.forEach((id,k)=>{N[id].r=[{t:'AFTER_TIMEOUT',d:k===0?.5:.4,a:[{n:'NAVIGATE',d:ids[k+1]||'709:26102',tr:{t:'SMART_ANIMATE',du:k===ids.length-1?.9:.77,e:'GENTLE'}}]}];});
  return ids[0];
}

  // the + gets its own square button next to the field
  {const ar=b0.k.find(c=>c.n==='area'),ph=b0.k.find(c=>c.n==='placeholder'),pl=b0.k.find(c=>c.n==='akar-icons:plus');
   if(ar&&ph&&pl&&!b0.k.some(c=>c.n==='btn')){ar.w=Math.round(ph.x-ar.x)*2+ph.w;
     const btn={n:'btn',y:'RE',x:ar.x+ar.w+12,Y:ar.Y,w:50,h:50,cr:ar.cr||4,f:clone(ar.f)};pl.x=btn.x+16;pl.Y=btn.Y+16;
     b0.k.splice(b0.k.indexOf(pl),0,btn);}}

  // swipe back works through the whole pitch too
  const navs=o=>{const out=[];(function w(o){for(const r of o.r||[])if(r.t==='ON_DRAG'||r.t==='AFTER_TIMEOUT')for(const a of r.a)if(a.n==='NAVIGATE')out.push(a.d);(o.k||[]).forEach(w);})(o);return out;};
  const q=['709:29362'];while(q.length){const i=q.shift();if(ONB.has(i)||!N[i]||i==='709:27226'||i===MENU)continue;ONB.add(i);q.push(...navs(N[i]));}
}
const _act=APP.action;
APP.action=(el,a)=>{ if(a.f==='budgetOpen'){ST.padOpen=true;show(FR_BUDGET,{t:'SMART_ANIMATE',du:.6,e:'GENTLE'});return;} _act(el,a); };

const _click=APP.click;

<script>
/* ---------- the phone's real keyboard ----------
   On a touch phone the drawn Figma keyboard steps aside and the phone's own
   keyboard opens instead (letters for names, email keyboard for email, URL
   keyboard for links, number pad for the budget). A hidden input near the top
   of the screen receives the typing and feeds it into the same field logic. */
const NATIVE=(matchMedia('(pointer: coarse)').matches||'ontouchstart' in window)&&!/[?&]drawnkeys\b/.test(location.search);
// an app, not a page: no double-tap or pinch zoom, and no zoom-in when a field gets the keyboard
if(matchMedia('(pointer: coarse)').matches){
  let vp=document.querySelector('meta[name=viewport]');if(!vp){vp=document.createElement('meta');vp.name='viewport';document.head.appendChild(vp);}
  vp.content='width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
  document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
  document.addEventListener('gesturestart',e=>e.preventDefault(),{passive:false});
}
const NK=document.createElement('textarea');
NK.setAttribute('autocomplete','off');NK.setAttribute('autocorrect','off');NK.setAttribute('spellcheck','false');
NK.style.cssText='position:fixed;left:0;top:90px;width:2px;height:24px;opacity:0;font-size:16px;border:0;padding:0;resize:none;caret-color:transparent;z-index:-1';
document.body.appendChild(NK);
const fieldText=set=>set===NAME_SET?(ST.first+(ST.active==='last'||ST.last?' '+ST.last:'')):set===AREA_SET?ST.about:set==='BUDGET'?ST.budget:TF[set]?ST[TF[set].key]:'';
function nativeFocus(set){
  if(!NATIVE)return;
  if(NK._set!==set||document.activeElement!==NK){
    NK._set=set;
    NK.setAttribute('inputmode',set==='BUDGET'?'numeric':set===EMAIL_SET?'email':set==='868:3416'?'url':'text');
    NK.setAttribute('autocapitalize',set===NAME_SET?'words':set===AREA_SET?'sentences':'none');
    NK.setAttribute('enterkeyhint',set===AREA_SET?'done':'done');
    NK.value=fieldText(set);NK._prev=NK.value;
    try{NK.focus({preventScroll:true});}catch(e){NK.focus();}
    try{NK.setSelectionRange(NK.value.length,NK.value.length);}catch(e){}
  }
}
function nativeFeed(k){ return NK._set==='BUDGET'?padKey(k):typeKey(k); }
NK.addEventListener('input',()=>{
  const a=NK._prev||'',b=NK.value;let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;
  for(let n=a.length-i;n>0;n--)nativeFeed('back');
  for(const ch of b.slice(i)){ if(ch==='\n'){nativeFeed('return');continue;} nativeFeed(ch===' '?'space':ch); }
  NK._prev=NK.value=NK.value.replace(/\n/g,'');
